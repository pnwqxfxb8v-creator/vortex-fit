<title>VORTEX FIT | خطة عبود</title>
<style>
:root{color-scheme:dark;--bg:#0b0f15;--surface:#151b23;--surface2:#1c2430;--text:#f4f5f8;--muted:#9ca8b7;--border:#2a3542;--accent:#f46466;--accent2:#fca5a5;--mint:#5bddb7;--gold:#f8c66f;--blue:#91baff;--shadow:0 16px 32px rgba(0,0,0,.18)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{touch-action:manipulation}input,textarea{accent-color:var(--accent)}::placeholder{color:#748191}
.app{max-width:650px;margin:0 auto;min-height:100vh;padding:0 16px 104px;background:radial-gradient(ellipse at 80% -15%,rgba(244,100,102,.12),transparent 44%),var(--bg)}
.app-header{padding:26px 2px 17px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#ff777b,#ae2e40);display:grid;place-items:center;font-size:25px;font-weight:1000;color:#fff;transform:rotate(-5deg);box-shadow:0 7px 16px #ef5f6440}.brand-en{font-size:13px;letter-spacing:2px;font-weight:900}.brand-sub{font-size:11px;color:var(--muted)}.date-pill{font-size:12px;color:var(--muted);border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 10px;white-space:nowrap}
h1{font-size:27px;line-height:1.35;margin:0 0 8px;letter-spacing:-.4px}h2{font-size:17px;margin:0}h3{font-size:15px;margin:0}p{margin:0}.muted{color:var(--muted)}.tiny{font-size:11px}.sm{font-size:13px}.large{font-size:25px;font-weight:900;line-height:1.2}.headrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px}.section{margin-top:24px}.card{background:var(--surface);border:1px solid var(--border);border-radius:19px;padding:16px;box-shadow:var(--shadow)}.soft{background:var(--surface2)}.strong{font-weight:800}.stack{display:grid;gap:12px}.gap8{display:grid;gap:8px}.flex{display:flex;align-items:center;gap:10px}.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.nowrap{white-space:nowrap}.ltr{direction:ltr;unicode-bidi:isolate}.number{font-weight:900;font-size:24px;line-height:1.25}.unit{font-size:12px;color:var(--muted);font-weight:500}.kpi{padding:14px;min-height:105px}.kpi .k-label{color:var(--muted);font-size:12px;margin-bottom:8px}.kpi .number{font-size:25px}.color-red{color:var(--accent2)}.color-mint{color:var(--mint)}.color-blue{color:var(--blue)}.color-gold{color:var(--gold)}
.hero{background:linear-gradient(135deg,rgba(246,92,105,.24),rgba(21,27,35,1) 73%);border-color:#753d4b;padding:18px}.hero-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.eyebrow{font-size:12px;color:#ffc0c4;letter-spacing:.3px;font-weight:800}.hero-title{font-size:24px;font-weight:900;margin:6px 0}.hero-desc{font-size:13px;color:#c5cad3}.hero-icon{font-size:39px;line-height:1}.pill{font-size:11px;padding:5px 10px;border-radius:999px;font-weight:800;border:1px solid var(--border);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;background:#1d2731}.pill.red{color:#ffc4c5;background:#592e37;border-color:#85454e}.pill.green{color:#b0ffdd;background:#1d473d;border-color:#346b5d}.pill.amber{color:#f8d490;background:#594322;border-color:#836333}.pill.blue{color:#bcd9ff;background:#253b55;border-color:#415e82}
.progress{width:100%;height:8px;background:#2a3440;border-radius:99px;overflow:hidden}.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#f46466,#ff9b9e);transition:width .3s}.fill.mint{background:linear-gradient(90deg,#34bf9b,#88eccd)}.fill.gold{background:linear-gradient(90deg,#d29b47,#ffdc8c)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;color:#fff;background:#303c49}.btn.primary{background:linear-gradient(125deg,#f66671,#d83e58);color:#fff;box-shadow:0 8px 18px #ce405340}.btn.success{background:linear-gradient(125deg,#21a47f,#167b67)}.btn.outline{background:transparent;border:1px solid var(--border);box-shadow:none}.btn.small{padding:8px 12px;font-size:12px;min-height:36px}.btn.block{width:100%}.btn:disabled{opacity:.55;cursor:not-allowed}.arrow{font-size:17px;font-weight:900}.divider{height:1px;background:var(--border);margin:14px 0}.caption{color:var(--muted);font-size:12px}
.week-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.date-chip{border:1px solid var(--border);background:var(--surface);border-radius:13px;min-height:75px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);padding:6px 1px}.date-chip.selected{background:#69333e;color:#fff;border-color:var(--accent)}.date-chip .dd{font-size:17px;font-weight:900}.date-chip .wd{font-size:10px}.date-chip .dot{height:5px;width:5px;border-radius:50%;background:#475364}.date-chip .dot.done{background:var(--mint)}.date-chip .dot.today{background:var(--gold)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:rgba(17,22,30,.96);border-top:1px solid var(--border);padding:7px max(11px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(11px,env(safe-area-inset-left));display:flex;justify-content:center;backdrop-filter:blur(20px)}.nav-inner{width:min(650px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:2px}.nav{padding:8px 1px 6px;background:transparent;border:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#8895a4;font-size:10px;font-weight:700;min-height:52px}.nav .ni{font-size:19px;line-height:1.1}.nav.active{color:#ff9da5;background:#432832}
.exercise{border:1px solid var(--border);padding:13px;border-radius:15px;background:var(--surface2)}.exercise.done{border-color:#37715d;background:#19382f}.checkbtn{background:#26323e;border:1px solid #455362;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;color:#fff;flex:0 0 auto}.exercise.done .checkbtn,.task.done .checkbtn{background:#209b78;border-color:#209b78}.ex-title{font-size:13px;font-weight:850}.ex-sub{font-size:11px;color:var(--muted);line-height:1.4}.ex-box{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px;margin-right:40px}.field{display:grid;gap:5px}.field label{color:var(--muted);font-size:11px;font-weight:700}.field input,.field textarea{background:#0f151c;color:var(--text);border:1px solid #3a4754;border-radius:10px;padding:10px 12px;min-width:0;width:100%;min-height:44px;font-size:15px}.field textarea{resize:vertical;min-height:86px}.field input:focus,.field textarea:focus{border-color:var(--accent)}.field .hint{font-size:10px;color:#8694a4}.task{display:flex;gap:11px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--surface2)}.task.done{background:#16362c;border-color:#366c58}.task-label{font-size:13px;font-weight:700}.task-sub{font-size:11px;color:var(--muted)}
.stat-progress{margin:9px 0 0}.statline{display:flex;justify-content:space-between;font-size:12px;margin:4px 0 6px}.input-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.note{font-size:12px;color:#e5bd83;background:#463824;border:1px solid #6e552c;padding:12px;border-radius:12px}.notice{background:#233443;border:1px solid #3f5868;border-radius:12px;padding:12px;color:#c6dce8;font-size:12px}.day-row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border)}.day-row:last-child{border:0}.day-bubble{width:43px;height:43px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;background:#263240;font-size:23px}.schedule-days{display:grid;gap:10px}.schedule-item{border:1px solid var(--border);border-radius:17px;padding:13px;background:var(--surface);display:flex;justify-content:space-between;align-items:center;gap:10px}.schedule-item.today{border-color:#f46466;background:#302027}
.empty{text-align:center;padding:28px 16px;color:var(--muted);font-size:13px}.weight-svg{display:block;width:100%;height:auto;overflow:visible}.weight-svg text{font-family:inherit;fill:#9ca8b7;font-size:10px}.value-small{font-size:12px;font-weight:800}.hline{display:flex;align-items:center;gap:7px}.mini-avatar{font-size:24px}.progress-badge{font-size:12px;border-radius:10px;padding:6px 9px;background:#293640;color:#d7e3ec}.footnote{font-size:11px;color:#8390a0;text-align:center;padding:15px 0}.settings-note{font-size:11px;color:#aab5c2;margin-top:10px}.danger-btn{color:#ffb6b8;border:1px solid #74404a;background:#47232a}.toast{position:fixed;left:50%;bottom:93px;transform:translateX(-50%);padding:11px 16px;background:#e4f7ec;color:#123b2a;border-radius:12px;font-weight:800;font-size:12px;z-index:30;box-shadow:var(--shadow);max-width:min(90vw,380px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
@media (min-width:650px){.app{border-left:1px solid #26303e;border-right:1px solid #26303e}.app-header{padding-top:36px}.bottom-nav{background:rgba(11,15,21,.88)}}@media (max-width:365px){.app{padding-left:11px;padding-right:11px}.kpi{padding:11px}.date-chip{min-height:68px}.date-chip .dd{font-size:15px}h1{font-size:24px}.hero-title{font-size:21px}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}

<body>
<div class="app" id="app"><div class="app-header"><div class="brand"><div class="logo">V</div><div><div class="brand-en">VORTEX FIT</div><div class="brand-sub">خطتك الرياضية الشخصية</div></div></div><div class="date-pill">جارٍ التحميل...</div></div></div>
<div class="bottom-nav" id="bottom-nav"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept=".json,application/json" hidden>
<script>
(()=>{'use strict';
const STORAGE='vortex_fit_abdullah_v1';
const DEFAULT_SETTINGS={name:'عبود',startWeight:117.9,goalWeight:90,firstGoalHigh:114,firstGoalLow:111,height:178,bodyFat:40,fatMass:47.2,muscleMass:40.2,visceralFat:22,bmr:1898,kcalFootball:2600,kcalGym:2450,kcalRest:2300,protein:180,fat:75,water:3000,sleep:8,satFootball:'21:00–22:30',monFootball:'19:30–21:00',wedFootball:'21:00–22:30'};
const DAY_NAMES=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const DAY_SHORT=['أحد','إثن','ثلا','أرب','خمي','جمع','سبت'];
const TYPES={upperA:{title:'Upper A · علوي',subtitle:'صدر · ظهر · أكتاف · ذراعين',emoji:'🏋️',color:'red',time:'60–70 دقيقة'},upperB:{title:'Upper B · علوي',subtitle:'ظهر · أكتاف · صدر · ذراعين',emoji:'💪',color:'red',time:'55–65 دقيقة'},lower:{title:'Lower · سفلي',subtitle:'رجلين · حوض · ثبات',emoji:'🦵',color:'red',time:'45–60 دقيقة'},football:{title:'كرة قدم',subtitle:'مهارة · لياقة · متعة',emoji:'⚽',color:'green',time:'90 دقيقة'},rest:{title:'راحة واستشفاء',subtitle:'استشفاء ونوم وترطيب',emoji:'🌿',color:'blue',time:'بدون تمرين قوي'}};
const EXERCISES={upperA:[['chest','Chest Press','ضغط صدر جهاز','3 × 10'],['pulldown','Lat Pulldown','سحب علوي','3 × 12'],['row','Seated Cable Row','سحب أرضي','3 × 12'],['incline','Incline Dumbbell Press','ضغط صدر علوي دمبل','2 × 10'],['lateral','Lateral Raises','رفرفة أكتاف جانبية','2 × 15'],['triceps','Triceps Pushdown','ترايسبس كيبل','2 × 12'],['biceps','Biceps Curl','بايسبس','2 × 12']],upperB:[['pulldown','Lat Pulldown','سحب علوي','3 × 10'],['shoulder','Shoulder Press','ضغط أكتاف','2 × 10'],['incline','Incline Chest Press','ضغط صدر علوي','3 × 10'],['row','Chest Supported Row','سحب ظهر مسنود','3 × 12'],['reverse','Reverse Fly','كتف خلفي','2 × 15'],['biceps','Biceps Curl','بايسبس','2 × 12'],['triceps','Triceps Extension','ترايسبس','2 × 12'],['plank','Plank','بلانك','2 × 30 ثانية']],lower:[['legpress','Leg Press','ضغط أرجل','2 × 10'],['legcurl','Leg Curl','خلفية الفخذ','2 × 12'],['extension','Leg Extension','أمامية الفخذ','2 × 12'],['rdl','Dumbbell Romanian Deadlift','ديدليفت روماني دمبل','2 × 10'],['glute','Glute Bridge','جسر الحوض','2 × 12'],['calf','Calf Raises','السمانة (إذا مسموح طبياً)','2 × 12'],['deadbug','Dead Bug','ثبات البطن','2 × 10']]};
const FOOTBALL_TASKS=[['warm','إحماء وتدرج قبل اللعب','جهّز المفاصل والكاحل وتجنب البداية المفاجئة'],['session','أنهيت حصة كرة القدم','90 دقيقة حسب جدولك'],['cool','تهدئة وترطيب بعد اللعب','مشـي هادئ وشرب سوائل']];
const REST_TASKS=[['rest','التزمت بيوم الراحة','بدون تمرين قوي'],['recover','اهتممت بالاستشفاء','نوم وترطيب ومشي خفيف اختياري']];
function newState(){return {version:1,settings:{...DEFAULT_SETTINGS},logs:{}}}
function loadState(){try{const v=JSON.parse(localStorage.getItem(STORAGE));if(v&&v.logs&&v.settings&&typeof v.logs==='object')return {version:1,settings:{...DEFAULT_SETTINGS,...v.settings},logs:v.logs}}catch(e){}return newState()}
let data=loadState();let screen='home';let selected=localISO(new Date());let weekAnchor=selected;let graphPeriod=30;
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(data));return true}catch(e){toast('لم نتمكن من حفظ البيانات. صدّر نسخة احتياطية.');return false}}
function localISO(date){const d=new Date(date);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateObj(iso){const p=iso.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12,0,0)}
function addDays(iso,n){const d=dateObj(iso);d.setDate(d.getDate()+n);return localISO(d)}
function saturdayStart(iso){const d=dateObj(iso);return addDays(iso,-((d.getDay()+1)%7))}
function typeFor(iso){return {0:'upperA',1:'football',2:'upperB',3:'football',4:'lower',5:'rest',6:'football'}[dateObj(iso).getDay()]}
function timeFor(iso){const day=dateObj(iso).getDay();return day===6?data.settings.satFootball:day===1?data.settings.monFootball:day===3?data.settings.wedFootball:TYPES[typeFor(iso)].time}
function targetFor(iso){const type=typeFor(iso);return +data.settings[type==='football'?'kcalFootball':type==='rest'?'kcalRest':'kcalGym']}
function logFor(iso){if(!data.logs[iso])data.logs[iso]={completed:false,checks:{},weights:{},reps:{},calories:'',protein:'',carbs:'',fat:'',water:'',sleep:'',weight:'',energy:'',notes:''};return data.logs[iso]}
function viewLog(iso){return data.logs[iso]||{completed:false,checks:{},weights:{},reps:{},calories:'',protein:'',carbs:'',fat:'',water:'',sleep:'',weight:'',energy:'',notes:''}}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}
function fnum(n,d=0){return Number.isFinite(+n)?(+n).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d}):'—'}
function hasNum(v){return v!==''&&v!==null&&v!==undefined&&Number.isFinite(+v)}
function prettyDate(iso){const d=dateObj(iso);return `${DAY_NAMES[d.getDay()]} ${d.getDate()} ${['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'][d.getMonth()]} ${d.getFullYear()}`}
function badge(text,color='red'){return `<span class="pill ${color}">${text}</span>`}
function progress(v,max,variant=''){return `<div class="progress"><div class="fill ${variant}" style="width:${Math.max(0,Math.min(100,max?100*v/max:0))}%"></div></div>`}
function kpi(label,val,unit,color=''){return `<div class="card kpi"><div class="k-label">${label}</div><div class="number ${color}"><span class="ltr">${val}</span> <span class="unit">${unit}</span></div></div>`}
function weeklySummary(anchor){const base=saturdayStart(anchor);let count=0;let done=0;for(let i=0;i<7;i++){const day=addDays(base,i);if(typeFor(day)!=='rest'){count++;if(viewLog(day).completed)done++}}return {count,done,base}}
function daysSinceStart(){const now=dateObj(localISO(new Date())).getTime();const start=dateObj('2026-10-31').getTime();return Math.max(0,Math.floor((now-start)/86400000))}
function weightRecords(){const values=Object.entries(data.logs).filter(([d,l])=>/^\d{4}-\d\d-\d\d$/.test(d)&&hasNum(l.weight)&&+l.weight>20&&+l.weight<400).map(([day,l])=>({day,weight:+l.weight})).sort((a,b)=>a.day.localeCompare(b.day));return values}
function latestWeight(){const x=weightRecords();return x.length?x[x.length-1].weight:+data.settings.startWeight}
function streak(){let day=localISO(new Date());if(!viewLog(day).completed)day=addDays(day,-1);let result=0;for(let i=0;i<100;i++){if(typeFor(day)==='rest'){day=addDays(day,-1);continue}if(!viewLog(day).completed)break;result++;day=addDays(day,-1)}return result}
function dayWeekStrip(iso){const base=saturdayStart(iso);let out='<div class="week-strip">';for(let i=0;i<7;i++){const d=addDays(base,i),v=dateObj(d),l=viewLog(d),isToday=d===localISO(new Date()),sel=d===iso;out+=`<button class="date-chip ${sel?'selected':''}" data-date="${d}" aria-label="${esc(prettyDate(d))}" aria-pressed="${sel}"><span class="wd">${DAY_SHORT[v.getDay()]}</span><span class="dd">${v.getDate()}</span><span class="dot ${l.completed?'done':isToday?'today':''}"></span></button>`}return out+'</div>'}
function header(){return `<div class="app-header"><div class="brand"><div class="logo">V</div><div><div class="brand-en">VORTEX FIT</div><div class="brand-sub">خطة ${esc(data.settings.name)} الشخصية</div></div></div><div class="date-pill">${dateObj(localISO(new Date())).toLocaleDateString('ar-SA',{day:'numeric',month:'short'})}</div></div>`}
function nav(){const items=[['home','⌂','الرئيسية'],['day','☑','يومي'],['schedule','▦','الجدول'],['progress','↗','التقدم'],['settings','⚙','الإعدادات']];document.getElementById('bottom-nav').innerHTML=`<div class="nav-inner">${items.map(([id,icon,name])=>`<button class="nav ${screen===id?'active':''}" data-nav="${id}" aria-label="${name}" aria-current="${screen===id?'page':'false'}"><span class="ni">${icon}</span><span>${name}</span></button>`).join('')}</div>`}
function home(){const today=localISO(new Date()),t=typeFor(today),meta=TYPES[t],log=viewLog(today),s=weeklySummary(today),weight=latestWeight();const start=+data.settings.startWeight,delta=weight-start;return `<div class="headrow"><div><div class="eyebrow">جاهز يا ${esc(data.settings.name)}؟ 🔥</div><h1>كل يوم خطوة أقرب لهدفك</h1><p class="muted sm">تابع التمارين، أكلك، ونزول وزنك من مكان واحد.</p></div></div>
<div class="hero card"><div class="hero-top"><div><div class="eyebrow">تمرين اليوم · ${DAY_NAMES[dateObj(today).getDay()]}</div><div class="hero-title">${meta.title}</div><div class="hero-desc">${meta.subtitle} · <span class="ltr">${esc(timeFor(today))}</span></div></div><div class="hero-icon">${meta.emoji}</div></div><div class="between" style="margin-top:20px"><span>${badge(log.completed?'✓ تم إنجاز اليوم':'الخطوة التالية',log.completed?'green':meta.color)}</span><button class="btn primary small" data-nav="day">${log.completed?'عرض تسجيل اليوم':'افتح يومي'} <span class="arrow">‹</span></button></div></div>
<section class="section"><div class="headrow"><h2>نظرة على تقدمك</h2><span class="caption">من فحص InBody</span></div><div class="grid2">${kpi('الوزن المسجل',fnum(weight,1),'كجم','color-red')}${kpi('الهدف النهائي',fnum(data.settings.goalWeight,0),'كجم','color-mint')}${kpi('كتلة العضلات',fnum(data.settings.muscleMass,1),'كجم','color-blue')}${kpi('نسبة الدهون عند البداية',fnum(data.settings.bodyFat,0),'%','color-gold')}</div><div class="card" style="margin-top:10px"><div class="between"><div><div class="caption">الفرق عن وزن البداية</div><div class="large ${delta<0?'color-mint':delta>0?'color-red':''} ltr">${delta>0?'+':''}${fnum(delta,1)} <span class="unit">كجم</span></div></div><div style="text-align:left"><div class="caption">بداية الخطة</div><div class="strong ltr">${fnum(start,1)} kg</div></div></div></div></section>
<section class="section"><div class="headrow"><h2>حصيلة الأسبوع</h2><span class="progress-badge"><span class="ltr">${s.done} / ${s.count}</span> حصص</span></div><div class="card"><div class="between"><span class="sm muted">حصص مكتملة من السبت للجمعة</span><span class="strong color-mint">${Math.round(100*s.done/s.count)}%</span></div><div style="margin:12px 0">${progress(s.done,s.count,'mint')}</div>${dayWeekStrip(today)}<div class="between" style="margin-top:14px"><span class="caption">سلسلة حصصك المتواصلة: <b>${streak()}</b></span><button class="btn outline small" data-nav="schedule">جدول الأسبوع</button></div></div></section>
<section class="section"><div class="headrow"><h2>خطة الأكل اليوم</h2><span class="caption">حسب نوع النشاط</span></div><div class="grid2">${kpi('هدف السعرات',fnum(targetFor(today)),'سعرة','color-gold')}${kpi('هدف البروتين',fnum(data.settings.protein),'جرام','color-mint')}</div><div class="card" style="margin-top:10px"><div class="between"><div><div class="caption">المسجل اليوم من السعرات</div><div class="large"><span class="ltr">${hasNum(log.calories)?fnum(log.calories):'—'}</span> <span class="unit">/ ${fnum(targetFor(today))}</span></div></div><button data-nav="day" class="btn outline small">سجل أكلك</button></div><div class="stat-progress">${progress(+log.calories,targetFor(today))}</div></div></section>
<section class="section"><div class="note">⚠️ مع تاريخ إصابة الكاحل، لا تزِد أحمال تمارين الأرجل أو السمانة إذا ظهر ألم أو تورم، وراجع المختص قبل العودة للتحميل القوي.</div></section>`}
function day(){const d=selected,l=viewLog(d),type=typeFor(d),meta=TYPES[type],today=localISO(new Date()),isFuture=d>today,exs=EXERCISES[type],items=type==='football'?FOOTBALL_TASKS:REST_TASKS;let total=exs?exs.length:items.length,complete=exs?exs.filter(x=>l.checks?.[x[0]]).length:items.filter(x=>l.checks?.[x[0]]).length;return `<div class="headrow"><div><div class="eyebrow">سجل يومك</div><h1>إنجاز يوم بيوم</h1><p class="muted sm">تقدر ترجع لأي يوم وتسجل تفاصيله.</p></div><button class="btn outline small" data-action="today">اليوم</button></div>
<div class="card"><div class="between" style="margin-bottom:12px"><button class="btn outline small" data-action="prev-day" aria-label="اليوم السابق">‹</button><div style="text-align:center"><div class="strong">${prettyDate(d)}</div><div class="caption">${d===today?'اليوم':d>today?'يوم قادم':'سجل سابق'}</div></div><button class="btn outline small" data-action="next-day" aria-label="اليوم التالي">›</button></div>${dayWeekStrip(d)}</div>
<section class="section"><div class="hero card"><div class="hero-top"><div><div class="eyebrow">خطة التمرين</div><div class="hero-title">${meta.emoji} ${meta.title}</div><div class="hero-desc">${meta.subtitle}</div></div><span class="pill ${meta.color}">${esc(timeFor(d))}</span></div><div class="between" style="margin-top:18px"><span class="sm">${complete} من ${total} أنشطة محددة</span><b class="color-mint">${Math.round(complete/total*100)}%</b></div><div style="margin-top:8px">${progress(complete,total,'mint')}</div></div></section>
<section class="section"><div class="headrow"><h2>${exs?'تفاصيل التمارين':'قائمة اليوم'}</h2>${badge(l.completed?'مكتمل ✓':'لم يكتمل',l.completed?'green':'amber')}</div><div class="stack">${exs?exs.map(([id,name,arabic,sets])=>`<div class="exercise ${l.checks?.[id]?'done':''}"><div class="flex"><button class="checkbtn" data-check="${id}" aria-label="${l.checks?.[id]?'إلغاء إتمام':'إتمام'} ${esc(arabic)}">${l.checks?.[id]?'✓':''}</button><div style="min-width:0;flex:1"><div class="ex-title">${esc(arabic)}</div><div class="ex-sub ltr" style="text-align:right">${esc(name)} · ${sets}</div></div>${l.checks?.[id]?badge('تم','green'):''}</div><div class="ex-box"><div class="field"><label for="w-${id}">الوزن المستخدم (كجم)</label><input id="w-${id}" type="number" inputmode="decimal" min="0" max="800" step="0.5" placeholder="اختياري" value="${esc(l.weights?.[id]??'')}" data-ex-weight="${id}"></div><div class="field"><label for="r-${id}">التكرارات المنفذة</label><input id="r-${id}" type="text" placeholder="مثل 10، 10، 9" value="${esc(l.reps?.[id]??'')}" data-ex-reps="${id}"></div></div></div>`).join(''):items.map(([id,title,sub])=>`<div class="task ${l.checks?.[id]?'done':''}"><button class="checkbtn" data-check="${id}" aria-label="${esc(title)}">${l.checks?.[id]?'✓':''}</button><div><div class="task-label">${title}</div><div class="task-sub">${sub}</div></div></div>`).join('')}</div>${type==='lower'?'<div class="note" style="margin-top:12px">ابدأ بمجموعتين لكل تمرين وبشدة متوسطة. تمرين السمانة مشروط بتعافي الكاحل والسماح الطبي.</div>':type==='football'?'<div class="notice" style="margin-top:12px">قبل اللعب بساعتين خذ وجبة خفيفة مناسبة، وبعده اهتم بالسوائل والطعام والاستشفاء.</div>':type==='rest'?'<div class="notice" style="margin-top:12px">هذا يوم راحة حقيقي. المشي الخفيف اختياري وليس واجباً.</div>':''}<button class="btn ${l.completed?'outline':'primary'} block" style="margin-top:14px" data-action="toggle-complete">${l.completed?'↶ إلغاء إتمام اليوم':'✓ اعتماد اليوم كمكتمل'}</button><p class="caption" style="text-align:center;margin-top:7px">يمكنك إتمام اليوم حتى لو لم تتبع جميع الأنشطة.</p></section>
<section class="section"><div class="headrow"><h2>سجل التغذية والاستشفاء</h2><span class="caption">يحفظ تلقائياً</span></div><div class="card"><div class="grid2">${kpi('سعرات اليوم المستهدفة',fnum(targetFor(d)),'سعرة','color-gold')}${kpi('بروتينك المستهدف',fnum(data.settings.protein),'جرام','color-mint')}</div><div class="input-grid" style="margin-top:14px">${inputField('calories','السعرات التي أكلتها','سعرة',l.calories,'number',0,9000)}${inputField('protein','البروتين','جرام',l.protein,'number',0,700)}${inputField('carbs','الكربوهيدرات','جرام',l.carbs,'number',0,1200)}${inputField('fat','الدهون','جرام',l.fat,'number',0,500)}${inputField('water','الماء','مل',l.water,'number',0,10000)}${inputField('sleep','ساعات النوم','ساعة',l.sleep,'number',0,24,'0.5')}${inputField('weight','وزنك اليوم','كجم',l.weight,'number',20,400,'0.1')}<div class="field"><label for="energy">طاقتك اليوم</label><select id="energy" data-value="energy" style="background:#0f151c;color:#fff;border:1px solid #3a4754;border-radius:10px;padding:10px;min-height:44px;width:100%"><option value="">اختر</option>${[['1','مرهق'],['2','منخفضة'],['3','عادية'],['4','جيدة'],['5','ممتازة']].map(([v,label])=>`<option value="${v}" ${l.energy===v?'selected':''}>${label}</option>`).join('')}</select></div></div><div class="field" style="margin-top:12px"><label for="notes">ملاحظات اليوم</label><textarea id="notes" data-value="notes" placeholder="كيف كان التمرين؟ هل حسيت بتعب، ألم، أو تحسن؟">${esc(l.notes)}</textarea></div><div class="divider"></div><div class="stack"><div><div class="statline"><span>السعرات المسجلة</span><span class="ltr">${hasNum(l.calories)?fnum(l.calories):'—'} / ${fnum(targetFor(d))}</span></div>${progress(+l.calories,targetFor(d))}</div><div><div class="statline"><span>البروتين</span><span class="ltr">${hasNum(l.protein)?fnum(l.protein):'—'} / ${fnum(data.settings.protein)} g</span></div>${progress(+l.protein,+data.settings.protein,'mint')}</div><div><div class="statline"><span>الماء</span><span class="ltr">${hasNum(l.water)?fnum(l.water):'—'} / ${fnum(data.settings.water)} ml</span></div>${progress(+l.water,+data.settings.water,'gold')}</div></div><div class="notice" style="margin-top:14px">الهدف الغذائي تقديري كبداية؛ راقب متوسط الوزن والطاقة والأداء. لا تنقص السعرات بعنف، خصوصاً مع كرة القدم.</div></div></section>`}
function inputField(key,label,unit,val,type,min,max,step='1'){return `<div class="field"><label for="v-${key}">${label} <span class="tiny">(${unit})</span></label><input id="v-${key}" data-value="${key}" type="${type}" inputmode="decimal" min="${min}" max="${max}" step="${step}" placeholder="أدخل الرقم" value="${esc(val)}"></div>`}
function schedule(){const today=localISO(new Date());const start=saturdayStart(weekAnchor);let weeks=[];for(let i=0;i<7;i++){let iso=addDays(start,i),v=dateObj(iso),type=typeFor(iso),m=TYPES[type],l=viewLog(iso);weeks.push(`<button class="schedule-item ${iso===today?'today':''}" data-date-nav="${iso}" style="width:100%;color:inherit;text-align:right"><div class="flex" style="min-width:0"><div class="day-bubble">${m.emoji}</div><div><div class="strong">${DAY_NAMES[v.getDay()]} <span class="caption">· ${v.getDate()}/${v.getMonth()+1}</span></div><div class="sm muted">${m.title}</div><div class="tiny color-blue ltr" style="text-align:right">${esc(timeFor(iso))}</div></div></div><span>${l.completed?badge('✓ تم','green'):badge(type==='rest'?'راحة':'مخطط',type==='rest'?'blue':'amber')}</span></button>`)}return `<div class="headrow"><div><div class="eyebrow">برنامج متوازن</div><h1>جدولك الأسبوعي</h1><p class="muted sm">3 كرة + 3 حديد + يوم راحة.</p></div></div><div class="card"><div class="between"><button class="btn outline small" data-action="prev-week">‹ أسبوع سابق</button><div style="text-align:center"><div class="strong tiny">${dateObj(start).getDate()}/${dateObj(start).getMonth()+1} — ${dateObj(addDays(start,6)).getDate()}/${dateObj(addDays(start,6)).getMonth()+1}</div><button class="btn outline small" style="margin-top:5px" data-action="current-week">هذا الأسبوع</button></div><button class="btn outline small" data-action="next-week">الأسبوع التالي ›</button></div></div><div class="schedule-days" style="margin-top:14px">${weeks.join('')}</div><div class="section card"><h3>لماذا هذا التوزيع؟</h3><p class="sm muted" style="margin-top:8px">الأحد والثلاثاء للعلوي، الخميس للسفلي بشدة متوسطة، والجمعة للاستشفاء قبل كرة السبت. لو رجلينك متعبة من كرة الأربعاء، خفّف أو أجّل السفلي، ولا تتمرن مع ألم بالكاحل.</p></div>`}
function chartSVG(period){const all=weightRecords(),end=localISO(new Date()),min=addDays(end,-period+1),records=all.filter(v=>v.day>=min&&v.day<=end),start={day:'2026-10-31',weight:+data.settings.startWeight};if(start.day>=min&&start.day<=end&&!records.some(x=>x.day===start.day))records.unshift(start);records.sort((a,b)=>a.day.localeCompare(b.day));if(records.length<2)return `<div class="empty">📈<div style="margin-top:8px">سجّل وزنك في يومين مختلفين لعرض منحنى التقدم.</div></div>`;let values=records.map(r=>r.weight),low=Math.floor(Math.min(...values)-1),high=Math.ceil(Math.max(...values)+1);if(high-low<3)high=low+3;const w=330,h=185,ml=32,mr=15,mt=10,mb=27,iw=w-ml-mr,ih=h-mt-mb;const minD=dateObj(records[0].day).getTime(),maxD=dateObj(records[records.length-1].day).getTime();const x=d=>ml+(dateObj(d).getTime()-minD)/(maxD-minD||1)*iw;const y=v=>mt+(high-v)/(high-low)*ih;let lines='';for(let i=0;i<4;i++){let yy=mt+i*ih/3,val=high-i*(high-low)/3;lines+=`<line x1="${ml}" y1="${yy}" x2="${w-mr}" y2="${yy}" stroke="#34424e" stroke-dasharray="4 5"/><text x="${ml-5}" y="${yy+3}" text-anchor="end">${val.toFixed(0)}</text>`}const points=records.map(r=>`${x(r.day).toFixed(1)},${y(r.weight).toFixed(1)}`).join(' ');const dots=records.map(r=>`<circle cx="${x(r.day)}" cy="${y(r.weight)}" r="3.8" fill="#ff818c" stroke="#151b23" stroke-width="2"><title>${r.day} · ${r.weight} كجم</title></circle>`).join('');return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="رسم يوضح تغيّر وزنك خلال ${period} يوماً" class="weight-svg">${lines}<polyline fill="none" stroke="#ff7886" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${points}"/>${dots}<text x="${ml}" y="${h-5}" text-anchor="start">${records[0].day.slice(5)}</text><text x="${w-mr}" y="${h-5}" text-anchor="end">${records[records.length-1].day.slice(5)}</text></svg>`}
function progressView(){const w=latestWeight(),change=w-(+data.settings.startWeight),records=weightRecords();let last14=0,completed14=0;const today=localISO(new Date());for(let i=0;i<14;i++){const d=addDays(today,-i);if(typeFor(d)!=='rest'){last14++;if(viewLog(d).completed)completed14++}}const goal=+data.settings.goalWeight,remaining=Math.max(0,w-goal),total=Math.max(1,+data.settings.startWeight-goal),percent=Math.max(0,Math.min(100,(+data.settings.startWeight-w)/total*100));return `<div class="eyebrow">رحلتك بالأرقام</div><h1>تقدمك الرياضي</h1><p class="muted sm">قارن نفسك بنفسك، مو برقم يوم واحد.</p><section class="section"><div class="grid2">${kpi('آخر وزن مسجل',fnum(w,1),'كجم','color-red')}${kpi('التغيّر من البداية',`${change>0?'+':''}${fnum(change,1)}`,'كجم',change<0?'color-mint':change>0?'color-red':'')}${kpi('المتبقي لهدف 90',fnum(remaining,1),'كجم','color-blue')}${kpi('حصص آخر 14 يوم',`${completed14}/${last14}`,'جلسة','color-mint')}</div></section><section class="section card"><div class="between"><h2>مسار وزنك</h2><div class="flex" style="gap:4px">${[7,30,90].map(n=>`<button class="btn small ${graphPeriod===n?'primary':'outline'}" data-period="${n}" style="padding:6px 9px;min-height:31px">${n} يوم</button>`).join('')}</div></div><div style="margin-top:16px">${chartSVG(graphPeriod)}</div><div class="caption" style="margin-top:8px">عدد تسجيلات الوزن: ${records.length} · أول قياس: 31/10/2026</div></section><section class="section card"><div class="between"><h2>هدفك النهائي</h2>${badge(`${fnum(percent,0)}% من الطريق`,percent>0?'green':'amber')}</div><div style="margin:14px 0">${progress(percent,100,'mint')}</div><div class="between"><span class="caption">البداية: <span class="ltr">${data.settings.startWeight}</span> كجم</span><span class="caption">الهدف: <span class="ltr">${data.settings.goalWeight}</span> كجم</span></div><div class="divider"></div><div class="strong">المرحلة الأولى: ${data.settings.firstGoalHigh}–${data.settings.firstGoalLow} كجم</div><div class="sm muted" style="margin-top:7px">خلال 12 أسبوعاً تقريباً، مع الحفاظ على القوة والعضلات. الهدف تقديري ويُعدل حسب النتائج والاستشفاء.</div></section><section class="section card"><h2>بيانات فحص InBody الأساسي</h2><p class="caption">31 أكتوبر 2026 · ارتفاع 178 سم · عمر 23</p><div class="divider"></div><div class="grid2">${kpi('كتلة الدهون',fnum(data.settings.fatMass,1),'كجم','color-gold')}${kpi('نسبة الدهون',fnum(data.settings.bodyFat,1),'%','color-red')}${kpi('الدهون الحشوية',fnum(data.settings.visceralFat),'مستوى','color-red')}${kpi('الأيض الأساسي',fnum(data.settings.bmr),'سعرة','color-blue')}</div><p class="settings-note">أرقام الجهاز تقديرية وتتأثر بالماء والطعام والتوقيت. معدل الأيض الأساسي ليس هدف السعرات اليومي.</p></section>`}
function settings(){const s=data.settings;const fields=[['name','الاسم','text'],['startWeight','وزن البداية (كجم)','number'],['goalWeight','هدف الوزن (كجم)','number'],['firstGoalHigh','الهدف المرحلي الأعلى (كجم)','number'],['firstGoalLow','الهدف المرحلي الأدنى (كجم)','number'],['kcalFootball','سعرات يوم الكرة','number'],['kcalGym','سعرات يوم الحديد','number'],['kcalRest','سعرات يوم الراحة','number'],['protein','هدف البروتين (جرام)','number'],['fat','هدف الدهون (جرام)','number'],['water','هدف الماء (مل)','number'],['sleep','هدف النوم (ساعة)','number'],['satFootball','وقت كرة السبت','text'],['monFootball','وقت كرة الاثنين','text'],['wedFootball','وقت كرة الأربعاء','text']];return `<div class="eyebrow">خلي الخطة تناسبك</div><h1>الإعدادات والبيانات</h1><p class="muted sm">عدّل الأهداف والأوقات، وسجلّاتك القديمة تبقى محفوظة.</p><section class="section card"><h2>أهدافك الشخصية</h2><div class="input-grid" style="margin-top:14px">${fields.map(([key,label,type])=>`<div class="field"><label for="set-${key}">${label}</label><input id="set-${key}" type="${type}" ${type==='number'?'inputmode="decimal" min="0" step="any"':''} data-setting="${key}" value="${esc(s[key])}"></div>`).join('')}</div><p class="settings-note">تُحفظ التعديلات تلقائياً. السعرات مبدئية وليست وصفة طبية؛ راجعها حسب نتائجك.</p></section><section class="section card"><h2>نسخة احتياطية</h2><p class="sm muted" style="margin:8px 0 15px">بياناتك محفوظة على هذا المتصفح/الجهاز فقط، وليست مرتبطة بحساب. صدّر نسخة JSON دورياً حتى لا تضيع إذا حذفت بيانات المتصفح أو غيّرت جهازك.</p><div class="grid2"><button class="btn primary block" data-action="export">↓ تصدير البيانات</button><button class="btn outline block" data-action="import">↑ استيراد نسخة</button></div><div class="divider"></div><button class="btn block danger-btn" data-action="reset">حذف كل التسجيلات</button></section><section class="section card"><h2>معلومات مهمة</h2><div class="gap8" style="margin-top:10px"><p class="sm muted">• التمرين: 3 أيام كرة، يومان علوي، يوم سفلي، يوم راحة.</p><p class="sm muted">• ابق على مسافة تكرارين أو ثلاثة من الفشل العضلي في البداية.</p><p class="sm muted">• في حال الدوخة أو انخفاض السكر، أوقف التمرين واطلب التقييم الطبي المناسب.</p><p class="sm muted">• في حال ألم الكاحل أو تورمه، لا تواصل التمرين المسبب للألم.</p></div></section><p class="footnote">VORTEX FIT · صنع خصيصاً لخطة عبود · جميع البيانات محلية على جهازك</p>`}
function render(scroll=false){const c=document.getElementById('app');const content=screen==='home'?home():screen==='day'?day():screen==='schedule'?schedule():screen==='progress'?progressView():settings();c.innerHTML=header()+`<main id="main">${content}</main>`;nav();if(scroll)window.scrollTo({top:0,behavior:'instant'});}
let toastTimer=null;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2700)}
function exportJSON(){const blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`VORTEX_FIT_backup_${localISO(new Date())}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('تم تجهيز نسخة البيانات للاحتفاظ بها')}
function importJSON(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const v=JSON.parse(reader.result);if(!v||typeof v!=='object'||!v.settings||!v.logs||Array.isArray(v.logs))throw Error('bad');if(!confirm('سيتم استبدال بياناتك الحالية بمحتوى النسخة الاحتياطية. هل تريد المتابعة؟'))return;data={version:1,settings:{...DEFAULT_SETTINGS,...v.settings},logs:v.logs};save();render();toast('تم استرجاع نسختك بنجاح')}catch(e){alert('الملف غير صالح. اختر ملف النسخة الاحتياطية بصيغة JSON.')}};reader.readAsText(file)}
document.addEventListener('click',e=>{const navB=e.target.closest('[data-nav]');if(navB){screen=navB.dataset.nav;if(screen==='day')selected=localISO(new Date());if(screen==='schedule')weekAnchor=localISO(new Date());render(true);return}const dBtn=e.target.closest('[data-date]');if(dBtn){selected=dBtn.dataset.date;screen='day';render();return}const dn=e.target.closest('[data-date-nav]');if(dn){selected=dn.dataset.dateNav;screen='day';render(true);return}const cb=e.target.closest('[data-check]');if(cb){const l=logFor(selected);l.checks=Object.assign({},l.checks,{[cb.dataset.check]:!l.checks?.[cb.dataset.check]});save();render();return}const p=e.target.closest('[data-period]');if(p){graphPeriod=+p.dataset.period;render();return}const a=e.target.closest('[data-action]');if(!a)return;switch(a.dataset.action){case 'today':selected=localISO(new Date());break;case 'prev-day':selected=addDays(selected,-1);break;case 'next-day':selected=addDays(selected,1);break;case 'prev-week':weekAnchor=addDays(weekAnchor,-7);break;case 'next-week':weekAnchor=addDays(weekAnchor,7);break;case 'current-week':weekAnchor=localISO(new Date());break;case 'toggle-complete':{let l=logFor(selected);l.completed=!l.completed;save();toast(l.completed?'تم اعتماد يومك! أحسنت 💪':'تم إلغاء اكتمال اليوم');break}case 'export':exportJSON();return;case 'import':document.getElementById('import-file').click();return;case 'reset':if(confirm('هل تريد حذف جميع سجلاتك اليومية بشكل نهائي؟ الإعدادات ستبقى كما هي.')){if(confirm('تأكيد أخير: لا يمكن التراجع بدون نسخة احتياطية.')){data.logs={};save();toast('تم حذف التسجيلات')}}break;default:return}render();});
document.addEventListener('input',e=>{const el=e.target,day=selected;if(el.matches('[data-value]')){const key=el.dataset.value,l=logFor(day);l[key]=el.value;save()}else if(el.matches('[data-ex-weight]')){const l=logFor(day);l.weights=l.weights||{};l.weights[el.dataset.exWeight]=el.value;save()}else if(el.matches('[data-ex-reps]')){const l=logFor(day);l.reps=l.reps||{};l.reps[el.dataset.exReps]=el.value;save()}else if(el.matches('[data-setting]')){const key=el.dataset.setting;data.settings[key]=el.type==='number'?(el.value===''?'':+el.value):el.value;save()}});
document.addEventListener('change',e=>{if(e.target.matches('[data-value],[data-setting]'))render();});
document.getElementById('import-file').addEventListener('change',e=>{importJSON(e.target.files[0]);e.target.value=''});
render();
})();
</script>
